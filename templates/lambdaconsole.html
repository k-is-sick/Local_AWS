<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lambda Console — LocalAWS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-main: #0e1117;
    --bg-surface: #161b22;
    --bg-surface-hover: #1c2129;
    --bg-card: #1f242d;
    --border-default: #2e3745;
    --border-subtle: #242b35;
    --text-primary: #d6dde5;
    --text-muted: #8b94a3;
    --accent-orange: #ff9900;
    --status-red: #f85149;
    --status-green: #3fb950;
    --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* TOP HEADER */
  .top-header {
    height: 48px;
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand-group { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 24px;
    height: 24px;
    background: var(--status-red);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    color: #ffffff;
  }
  .brand-wordmark {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-primary);
    padding: 4px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-default);
    border-radius: 4px;
  }
  .btn-signout {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-default);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-signout:hover {
    color: #ffffff;
    border-color: var(--accent-orange);
    background: var(--bg-surface-hover);
  }

  /* PAGE HEADER */
  .page-header {
    padding: 20px 32px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-subtle);
  }
  .page-title {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lambda-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--status-red);
    background: rgba(248, 81, 73, 0.14);
    border: 1px solid rgba(248, 81, 73, 0.35);
    padding: 2px 8px;
    border-radius: 2px;
  }
  .badge-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* MAIN LAYOUT */
  main {
    flex: 1;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 32px;
  }

  .table-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    background-color: #12161d;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-default);
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 13px;
    color: var(--text-primary);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background-color: var(--bg-surface-hover); }

  .func-name {
    font-weight: 600;
    color: var(--accent-orange);
    font-family: var(--font-mono);
    text-decoration: none;
    cursor: pointer;
  }
  .func-name:hover { text-decoration: underline; }
  .code-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--bg-main);
    border: 1px solid var(--border-subtle);
    padding: 2px 6px;
    border-radius: 2px;
    color: var(--text-primary);
  }

  button {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid var(--border-default);
    color: var(--text-primary);
    background: var(--bg-surface);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: var(--bg-surface-hover);
    border-color: var(--text-muted);
  }
  button.btn-primary {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: #0e1117;
    font-weight: 600;
  }
  button.btn-primary:hover { background: #ffaa22; border-color: #ffaa22; }
  button.btn-secondary { background: var(--bg-surface); border-color: var(--border-default); }
  button.btn-danger {
    color: var(--status-red);
    border-color: rgba(248, 81, 73, 0.4);
    background: transparent;
  }
  button.btn-danger:hover {
    background: rgba(248, 81, 73, 0.12);
    border-color: var(--status-red);
  }
  button.btn-sm { padding: 4px 10px; font-size: 11.5px; }

  /* MODALS */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(6, 9, 13, 0.8);
    backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    width: 600px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .close-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0; }
  .close-btn:hover { color: #ffffff; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--bg-main);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .form-group textarea { font-family: var(--font-mono); resize: vertical; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent-orange);
    box-shadow: 0 0 0 1px var(--accent-orange);
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

  .log-box, .result-box {
    background: var(--bg-main);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-box { color: var(--status-green); }
  .result-box { color: #58a6ff; }

  .empty-state { padding: 48px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>

<header class="top-header">
  <div class="brand-group">
    <a href="/services" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
      <img src="/static/images/Local_AWS_logo.png" alt="LocalAWS Logo" style="height:44px; width:auto; display:block; object-fit:contain;">
      <div class="brand-wordmark">LocalAWS Console</div>
    </a>
  </div>
  <div class="header-right">
    <a href="/services" style="color:var(--text-muted); font-size:12px;"><i class="fa-solid fa-arrow-left"></i> Services</a>
    <div class="user-badge" id="userEmail">Loading...</div>
    <button class="btn-signout" onclick="logout()">Sign out</button>
  </div>
</header>

<div class="page-header">
  <div class="page-title">
    <i class="fa-solid fa-bolt" style="color:var(--status-red);"></i>
    AWS Lambda Functions
    <span class="lambda-chip">lambda.local</span>
    <span class="badge-count" id="funcCount">0</span>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-secondary" onclick="loadFunctions()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    <button class="btn btn-primary" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> Create function</button>
  </div>
</div>

<main>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Function Name</th>
          <th>Runtime</th>
          <th>Handler</th>
          <th>Timeout</th>
          <th>Created At</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody id="funcTable">
        <tr>
          <td colspan="6" class="empty-state">Loading functions...</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Create Function Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-title">
      <span><i class="fa-solid fa-cube" style="color:var(--accent-orange);"></i> Create Lambda Function</span>
      <button class="close-btn" onclick="closeModal('createModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="createForm" onsubmit="handleCreate(event)">
      <div class="form-group">
        <label for="createName">Function Name</label>
        <input type="text" id="createName" required placeholder="e.g. my-first-function">
      </div>
      <div style="display:flex; gap:12px;">
        <div class="form-group" style="flex:1">
          <label for="createRuntime">Runtime</label>
          <select id="createRuntime">
            <option value="python3.11">python3.11</option>
            <option value="python3.10">python3.10</option>
            <option value="nodejs20.x">nodejs20.x</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label for="createHandler">Handler</label>
          <input type="text" id="createHandler" value="handler.handler" required>
        </div>
        <div class="form-group" style="flex:1">
          <label for="createTimeout">Timeout (sec)</label>
          <input type="number" id="createTimeout" value="15" min="1" max="300">
        </div>
      </div>
      <div class="form-group">
        <label for="createCode">Python Code (Inline)</label>
        <textarea id="createCode" rows="8">def handler(event, context):
    print("Received event:", event)
    name = event.get("name", "World")
    return {
        "statusCode": 200,
        "message": f"Hello {name} from LocalAWS Lambda!"
    }
</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('createModal')">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Deploy function</button>
      </div>
    </form>
  </div>
</div>

<!-- Invoke Tester Modal -->
<div class="modal-overlay" id="invokeModal">
  <div class="modal" style="width:640px;">
    <div class="modal-title">
      <span><i class="fa-solid fa-bolt" style="color:var(--accent-orange);"></i> Test Function: <span id="invokeFuncName" style="color:var(--accent-orange)"></span></span>
      <button class="close-btn" onclick="closeModal('invokeModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-group">
      <label for="invokePayload">Event Payload (JSON)</label>
      <textarea id="invokePayload" rows="5">{\n  "name": "LocalAWS Developer",\n  "key": "value"\n}</textarea>
    </div>
    <div style="margin-bottom:16px;">
      <button class="btn btn-primary" id="invokeBtn" onclick="executeInvoke()"><i class="fa-solid fa-play"></i> Run Invocation</button>
      <span id="invokeStatus" style="margin-left:10px; font-size:12px; font-family:var(--font-mono); color:var(--text-muted)"></span>
    </div>
    <div class="form-group">
      <label>Execution Output (Payload)</label>
      <div class="result-box" id="invokeResult">Click 'Run Invocation' to execute...</div>
    </div>
    <div class="form-group">
      <label>Log Output (Stdout/Stderr)</label>
      <div class="log-box" id="invokeLogs">—</div>
    </div>
  </div>
</div>

<script>
let currentInvokeName = '';

async function loadUserInfo() {
  try {
    const res = await fetch("/api/me", { credentials: "include" });
    if (res.ok) {
      const data = await res.json();
      if (data.email) document.getElementById("userEmail").textContent = data.email;
    }
  } catch (err) {}
}

async function logout() {
  await fetch("/api/logout", { method: "POST", credentials: "include" });
  window.location.href = "/";
}

async function loadFunctions() {
  try {
    const res = await fetch('/api/lambda/functions');
    const data = await res.json();
    const tbody = document.getElementById('funcTable');
    const funcs = data.functions || [];
    document.getElementById('funcCount').innerText = funcs.length;

    if (funcs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No Lambda functions deployed yet. Click "+ Create function" to get started.</td></tr>`;
      return;
    }

    tbody.innerHTML = funcs.map(f => `
      <tr>
        <td><a class="func-name" href="javascript:openInvokeModal('${f.name}')"><i class="fa-solid fa-cube"></i> ${f.name}</a></td>
        <td><span class="code-tag">${f.runtime}</span></td>
        <td><span class="code-tag">${f.handler}</span></td>
        <td>${f.timeout}s</td>
        <td style="color:var(--text-muted); font-family:var(--font-mono);">${f.created_at || 'Just now'}</td>
        <td style="text-align:right">
          <button class="btn btn-secondary btn-sm" onclick="openInvokeModal('${f.name}')"><i class="fa-solid fa-play"></i> Test</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFunction('${f.name}')"><i class="fa-solid fa-trash"></i> Delete</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('funcTable').innerHTML = `<tr><td colspan="6" class="empty-state" style="color:var(--status-red)">Failed to load functions: ${err.message}</td></tr>`;
  }
}

function openCreateModal() {
  document.getElementById('createModal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function handleCreate(e) {
  e.preventDefault();
  const payload = {
    name: document.getElementById('createName').value.trim(),
    runtime: document.getElementById('createRuntime').value,
    handler: document.getElementById('createHandler').value.trim(),
    timeout: parseInt(document.getElementById('createTimeout').value, 10),
    code: document.getElementById('createCode').value
  };

  try {
    const res = await fetch('/api/lambda/functions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const err = await res.json();
      alert('Error creating function: ' + (err.error || 'Unknown error'));
      return;
    }
    closeModal('createModal');
    document.getElementById('createForm').reset();
    loadFunctions();
  } catch (err) {
    alert('Failed to connect: ' + err.message);
  }
}

async function deleteFunction(name) {
  if (!confirm(`Are you sure you want to delete function '${name}'?`)) return;
  try {
    const res = await fetch(`/api/lambda/functions/${name}`, { method: 'DELETE' });
    if (res.ok) {
      loadFunctions();
    } else {
      const err = await res.json();
      alert('Error deleting function: ' + (err.error || 'Unknown error'));
    }
  } catch (err) {
    alert('Failed to delete: ' + err.message);
  }
}

function openInvokeModal(name) {
  currentInvokeName = name;
  document.getElementById('invokeFuncName').innerText = name;
  document.getElementById('invokeResult').innerText = "Click 'Run Invocation' to execute...";
  document.getElementById('invokeLogs').innerText = "—";
  document.getElementById('invokeStatus').innerText = "";
  document.getElementById('invokeModal').classList.add('open');
}

async function executeInvoke() {
  const btn = document.getElementById('invokeBtn');
  const statusSpan = document.getElementById('invokeStatus');
  btn.disabled = true;
  statusSpan.innerText = "Running container execution...";

  let payloadObj = {};
  try {
    payloadObj = JSON.parse(document.getElementById('invokePayload').value);
  } catch (e) {
    alert('Invalid JSON in event payload');
    btn.disabled = false;
    statusSpan.innerText = "";
    return;
  }

  try {
    const res = await fetch(`/api/lambda/functions/${currentInvokeName}/invoke`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payloadObj)
    });

    const data = await res.json();
    btn.disabled = false;
    statusSpan.innerText = `Duration: ${data.execution_time_ms || 0} ms | Status: ${res.status}`;

    document.getElementById('invokeResult').innerText = JSON.stringify(data.payload || data.error || data, null, 2);
    document.getElementById('invokeLogs').innerText = data.logs || 'No log output captured.';
  } catch (err) {
    btn.disabled = false;
    statusSpan.innerText = "Execution failed";
    document.getElementById('invokeResult').innerText = "Error: " + err.message;
  }
}

loadUserInfo();
loadFunctions();
</script>
</body>
</html>
