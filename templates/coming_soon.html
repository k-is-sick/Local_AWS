<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ service }} — LocalAWS</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --border:#2a313c; --text:#d6dde5; --muted:#8b94a3; --accent:#ff9900; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .logo { width:28px; height:28px; background:var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#161616; font-size:13px; }
  header a { color: var(--text); text-decoration: none; font-size: 14px; }
  main { max-width: 500px; margin: 100px auto; text-align: center; padding: 0 20px; }
  main h2 { font-size: 24px; margin-bottom: 10px; }
  main p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  a.btn { text-decoration: none; padding: 10px 20px; border-radius: 6px; font-size: 13px; border: 1px solid var(--border); color: var(--text); }
  a.btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header><div class="logo">L</div><a href="/services">LocalAWS</a></header>
<main>
  <h2>{{ service }} — Coming Soon</h2>
  <p>This service hasn't been built yet. Only S3 is currently implemented in this LocalAWS instance.</p>
  <a class="btn" href="/services">← Back to Services</a>
</main>
</body>
</html>
