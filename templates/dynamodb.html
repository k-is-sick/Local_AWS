<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DynamoDB Console — LocalAWS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-main: #0e1117;
    --bg-surface: #161b22;
    --bg-surface-hover: #1c2129;
    --bg-card: #1f242d;
    --border-default: #2e3745;
    --border-subtle: #242b35;
    --text-primary: #d6dde5;
    --text-muted: #8b94a3;
    --accent-orange: #ff9900;
    --status-green: #3fb950;
    --status-blue: #58a6ff;
    --status-red: #f85149;
    --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* TOP HEADER */
  .top-header {
    height: 48px;
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand-group { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 24px;
    height: 24px;
    background: var(--status-blue);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    color: #0e1117;
  }
  .brand-wordmark {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-primary);
    padding: 4px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-default);
    border-radius: 4px;
  }
  .btn-signout {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-default);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-signout:hover {
    color: #ffffff;
    border-color: var(--accent-orange);
    background: var(--bg-surface-hover);
  }

  /* PAGE HEADER */
  .page-header {
    padding: 20px 32px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-subtle);
  }
  .page-title {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .count-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* MAIN LAYOUT */
  main {
    flex: 1;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 32px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-body {
    padding: 16px;
  }

  label {
    font-size: 12px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  input, textarea {
    width: 100%;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid var(--border-default);
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-orange);
    box-shadow: 0 0 0 1px var(--accent-orange);
  }
  textarea {
    height: 130px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
  }

  button {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid var(--border-default);
    color: var(--text-primary);
    background: var(--bg-surface);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: var(--bg-surface-hover);
    border-color: var(--text-muted);
  }
  button.primary {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: #0e1117;
    font-weight: 600;
  }
  button.primary:hover { background: #ffaa22; border-color: #ffaa22; }
  button.danger {
    color: var(--status-red);
    border-color: rgba(248, 81, 73, 0.4);
    background: transparent;
  }
  button.danger:hover {
    background: rgba(248, 81, 73, 0.12);
    border-color: var(--status-red);
  }
  .btn-full { width: 100%; justify-content: center; }

  .table-list {
    display: flex;
    flex-direction: column;
  }
  .table-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s ease;
  }
  .table-item:hover { background: var(--bg-surface-hover); }
  .table-item.active {
    background: var(--bg-surface-hover);
    border-left: 3px solid var(--accent-orange);
    font-weight: 600;
  }
  .table-item .del {
    color: var(--status-red);
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .table-item:hover .del { opacity: 1; }
  .table-item .del:hover { background: rgba(248, 81, 73, 0.15); }

  .right-panel .table-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-default);
    background: var(--bg-card);
  }
  .right-panel h2.table-title {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    font-family: var(--font-mono);
  }
  .meta-chips {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 11px;
    font-family: var(--font-mono);
    background: var(--bg-main);
    border: 1px solid var(--border-subtle);
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--text-muted);
  }
  .chip strong { color: var(--accent-orange); }

  .toolbar {
    padding: 12px 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input {
    margin: 0;
    flex: 1;
    min-width: 200px;
  }

  .table-wrap {
    overflow-x: auto;
    background: var(--bg-surface);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    padding: 10px 16px;
    background: #12161d;
    border-bottom: 1px solid var(--border-default);
  }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border-subtle);
    font-family: var(--font-mono);
    font-size: 12px;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr:hover td { background: var(--bg-surface-hover); }

  .empty {
    color: var(--text-muted);
    text-align: center;
    padding: 48px 20px;
    font-size: 13px;
  }
  .status {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    min-height: 16px;
    margin-top: 10px;
  }
  .status.ok {
    color: var(--status-green);
    background: rgba(63, 185, 80, 0.1);
    border: 1px solid rgba(63, 185, 80, 0.25);
  }
  .status.error {
    color: var(--status-red);
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.25);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 13, 0.8);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    width: 540px;
    max-width: 90vw;
    padding: 24px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .modal h3 {
    margin: 0 0 16px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .json-hint {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-muted);
    margin-top: -6px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header class="top-header">
  <div class="brand-group">
    <a href="/services" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
      <img src="/static/images/Local_AWS_logo.png" alt="LocalAWS Logo" style="height:44px; width:auto; display:block; object-fit:contain;">
      <div class="brand-wordmark">LocalAWS Console</div>
    </a>
  </div>
  <div class="header-right">
    <a href="/services" style="color:var(--text-muted); font-size:12px;"><i class="fa-solid fa-arrow-left"></i> Services</a>
    <div class="user-badge" id="userEmailBadge">Loading...</div>
    <button class="btn-signout" onclick="logout()">Sign out</button>
  </div>
</header>

<div class="page-header">
  <div class="page-title">
    <i class="fa-solid fa-table-cells" style="color:var(--status-blue);"></i>
    Amazon DynamoDB
    <span class="count-badge" id="tableCountBadge">Loading...</span>
  </div>
</div>

<main>
  <!-- LEFT PANEL: Create Table & Table List -->
  <div style="display:flex; flex-direction:column; gap:20px;">
    <div class="panel-card">
      <div class="panel-header">
        <span class="panel-title"><i class="fa-solid fa-plus-circle" style="color:var(--accent-orange);"></i> Create Table</span>
      </div>
      <div class="panel-body">
        <label for="newTableName">Table Name</label>
        <input type="text" id="newTableName" placeholder="e.g. users">
        
        <label for="newPK">Partition Key (PK)</label>
        <input type="text" id="newPK" placeholder="e.g. user_id">
        
        <label for="newSK">Sort Key (SK, optional)</label>
        <input type="text" id="newSK" placeholder="e.g. created_at">
        
        <button class="primary btn-full" onclick="createTable()"><i class="fa-solid fa-square-plus"></i> Create Table</button>
        <div class="status" id="createStatus"></div>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-header">
        <span class="panel-title"><i class="fa-solid fa-list-ul"></i> Tables</span>
      </div>
      <div class="table-list" id="tableList">
        <div class="empty">Loading tables...</div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL: Table Viewer -->
  <div class="panel-card right-panel" id="rightPanel" style="display:none;">
    <div class="table-header">
      <div>
        <h2 class="table-title" id="tableTitle"></h2>
        <div class="meta-chips" id="tableMetaChips"></div>
      </div>
      <button class="danger" onclick="deleteCurrentTable()"><i class="fa-solid fa-trash"></i> Delete Table</button>
    </div>

    <div class="toolbar">
      <button class="primary" onclick="openPutModal()"><i class="fa-solid fa-plus"></i> Put Item</button>
      <input type="text" id="getKeyInput" placeholder="Enter partition key value to query...">
      <button onclick="getItem()"><i class="fa-solid fa-magnifying-glass"></i> Get Item</button>
      <button onclick="scanItems()"><i class="fa-solid fa-rotate-right"></i> Scan All</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="itemsHead"></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <div class="empty" id="itemsEmpty" style="display:none;"></div>
    </div>

    <div class="status" id="tableStatus"></div>
  </div>

  <!-- NO TABLE SELECTED PLACEHOLDER -->
  <div class="panel-card right-panel" id="noTableSelectedPanel">
    <div class="empty" style="padding: 80px 20px;">
      <i class="fa-solid fa-table" style="font-size: 32px; color: var(--accent-orange); margin-bottom: 16px; display:block;"></i>
      <h3 style="margin: 0 0 8px; font-size: 16px; color: #ffffff;">No Table Selected</h3>
      <p style="margin: 0; color: var(--text-muted);">Select a table from the sidebar or create a new table to view and edit items.</p>
    </div>
  </div>
</main>

<!-- Put Item Modal -->
<div class="modal-overlay" id="putModal">
  <div class="modal">
    <h3><i class="fa-solid fa-file-code" style="color:var(--accent-orange);"></i> Put Item</h3>
    <label for="putItemJson">JSON Item Document</label>
    <textarea id="putItemJson" placeholder='{"user_id": "1", "name": "Alice"}'></textarea>
    <div class="json-hint"><i class="fa-solid fa-circle-info"></i> JSON document must include the table's partition key (and optional sort key).</div>
    <div class="status" id="putStatus"></div>
    <div class="modal-footer">
      <button onclick="closePutModal()">Cancel</button>
      <button class="primary" onclick="putItem()"><i class="fa-solid fa-floppy-disk"></i> Save Item</button>
    </div>
  </div>
</div>

<script>
let currentTable = null;
let currentMeta = null;

async function api(path, options={}) {
  options.credentials = "include";
  const res = await fetch("/api/dynamodb" + path, options);
  return res;
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg || "";
  el.className = "status" + (type ? " " + type : "");
}

async function loadUserInfo() {
  try {
    const res = await fetch("/api/me", { credentials: "include" });
    if (res.ok) {
      const data = await res.json();
      document.getElementById("userEmailBadge").textContent = data.email || "User";
    }
  } catch (err) {}
}

async function logout() {
  await fetch("/api/logout", { method: "POST", credentials: "include" });
  window.location.href = "/";
}

async function loadTables() {
  try {
    const res = await api("/tables");
    if (!res.ok) {
      if (res.status === 401) window.location.href = "/signin";
      return;
    }
    const data = await res.json();
    const el = document.getElementById("tableList");
    const countBadge = document.getElementById("tableCountBadge");
    const tables = data.tables || [];
    countBadge.textContent = `${tables.length} table${tables.length === 1 ? '' : 's'}`;

    if (tables.length === 0) {
      el.innerHTML = `<div class="empty">No tables created yet</div>`;
      return;
    }

    el.innerHTML = tables.map(t => `
      <div class="table-item ${t === currentTable ? 'active' : ''}" onclick="openTable('${t}')">
        <span><i class="fa-solid fa-table" style="color:var(--accent-orange); margin-right:8px;"></i> ${t}</span>
        <span class="del" onclick="event.stopPropagation(); deleteTableByName('${t}')" title="Delete table"><i class="fa-solid fa-trash"></i></span>
      </div>`).join("");
  } catch (err) {
    setStatus("createStatus", "Failed to connect to DynamoDB API", "error");
  }
}

async function createTable() {
  const name = document.getElementById("newTableName").value.trim();
  const pk = document.getElementById("newPK").value.trim();
  const sk = document.getElementById("newSK").value.trim();
  
  if (!name || !pk) {
    setStatus("createStatus", "Table name and partition key are required", "error");
    return;
  }
  
  try {
    const res = await api("/tables", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ table_name: name, partition_key: pk, sort_key: sk || null })
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus("createStatus", data.error || "Failed to create table", "error");
      return;
    }
    setStatus("createStatus", "Table created: " + name, "ok");
    document.getElementById("newTableName").value = "";
    document.getElementById("newPK").value = "";
    document.getElementById("newSK").value = "";
    await loadTables();
    openTable(name);
  } catch (err) {
    setStatus("createStatus", "Could not create table: " + err.message, "error");
  }
}

async function deleteTableByName(name) {
  if (!confirm(`Delete table "${name}"? All contained items will be permanently removed.`)) return;
  try {
    const res = await api(`/tables/${encodeURIComponent(name)}`, { method: "DELETE" });
    if (res.ok || res.status === 204) {
      if (currentTable === name) {
        currentTable = null;
        document.getElementById("rightPanel").style.display = "none";
        document.getElementById("noTableSelectedPanel").style.display = "block";
      }
      loadTables();
    }
  } catch (err) {
    alert("Failed to delete table: " + err.message);
  }
}

function deleteCurrentTable() {
  if (currentTable) deleteTableByName(currentTable);
}

async function openTable(name) {
  currentTable = name;
  try {
    const res = await api(`/tables/${encodeURIComponent(name)}`);
    if (!res.ok) {
      alert("Could not load table metadata");
      return;
    }
    const data = await res.json();
    currentMeta = data.meta;

    document.getElementById("noTableSelectedPanel").style.display = "none";
    document.getElementById("rightPanel").style.display = "block";
    document.getElementById("tableTitle").textContent = name;

    const chipsEl = document.getElementById("tableMetaChips");
    let chipsHtml = `<div class="chip">PK: <strong>${data.meta.partition_key}</strong></div>`;
    if (data.meta.sort_key) {
      chipsHtml += `<div class="chip">SK: <strong>${data.meta.sort_key}</strong></div>`;
    }
    chipsHtml += `<div class="chip">Items: <strong id="tableItemCount">${data.count}</strong></div>`;
    chipsEl.innerHTML = chipsHtml;

    loadTables();
    scanItems();
  } catch (err) {
    console.error(err);
  }
}

async function scanItems() {
  if (!currentTable) return;
  setStatus("tableStatus", "Scanning table...", "");
  try {
    const res = await api(`/tables/${encodeURIComponent(currentTable)}/scan`);
    const data = await res.json();
    if (!res.ok) {
      setStatus("tableStatus", data.error || "Scan failed", "error");
      return;
    }
    renderItems(data.items);
    const countEl = document.getElementById("tableItemCount");
    if (countEl) countEl.textContent = data.count;
    setStatus("tableStatus", `${data.count} item(s) scanned`, "ok");
  } catch (err) {
    setStatus("tableStatus", "Scan failed: " + err.message, "error");
  }
}

async function getItem() {
  const key = document.getElementById("getKeyInput").value.trim();
  if (!key) {
    scanItems();
    return;
  }
  setStatus("tableStatus", "Fetching item...", "");
  try {
    const res = await api(`/tables/${encodeURIComponent(currentTable)}/items/${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!res.ok) {
      setStatus("tableStatus", data.error || "Item not found", "error");
      renderItems([]);
      return;
    }
    renderItems([data.item]);
    setStatus("tableStatus", "Item found", "ok");
  } catch (err) {
    setStatus("tableStatus", "Error: " + err.message, "error");
  }
}

function renderItems(items) {
  const head = document.getElementById("itemsHead");
  const body = document.getElementById("itemsBody");
  const empty = document.getElementById("itemsEmpty");

  if (!items || items.length === 0) {
    head.innerHTML = "";
    body.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = "No items in this table matching query.";
    return;
  }

  empty.style.display = "none";
  const cols = [...new Set(items.flatMap(i => Object.keys(i)))];
  head.innerHTML = cols.map(c => `<th>${c}</th>`).join("") + `<th style="text-align:right;">Actions</th>`;

  body.innerHTML = items.map(item => {
    const pk = currentMeta.partition_key;
    const sk = currentMeta.sort_key;
    const key = sk ? `${item[pk]}#${item[sk] ?? ""}` : item[pk];
    const cells = cols.map(c => {
      const val = item[c];
      const displayVal = typeof val === "object" ? JSON.stringify(val) : (val ?? "");
      return `<td title="${String(displayVal).replace(/"/g, '&quot;')}">${displayVal}</td>`;
    }).join("");

    return `<tr>
      ${cells}
      <td style="text-align:right;">
        <button class="danger" style="padding: 3px 8px; font-size: 11px;" onclick="deleteItem('${encodeURIComponent(key)}')"><i class="fa-solid fa-trash"></i> Delete</button>
      </td>
    </tr>`;
  }).join("");
}

async function deleteItem(encodedKey) {
  const key = decodeURIComponent(encodedKey);
  if (!confirm(`Delete item with key "${key}"?`)) return;
  try {
    const res = await api(`/tables/${encodeURIComponent(currentTable)}/items/${encodedKey}`, { method: "DELETE" });
    if (res.ok || res.status === 204) {
      setStatus("tableStatus", "Item deleted", "ok");
      scanItems();
    } else {
      const data = await res.json();
      setStatus("tableStatus", data.error || "Delete failed", "error");
    }
  } catch (err) {
    setStatus("tableStatus", "Delete failed: " + err.message, "error");
  }
}

function openPutModal() {
  if (!currentMeta) return;
  const example = { [currentMeta.partition_key]: "value" };
  if (currentMeta.sort_key) example[currentMeta.sort_key] = "value";
  document.getElementById("putItemJson").value = JSON.stringify(example, null, 2);
  document.getElementById("putStatus").textContent = "";
  document.getElementById("putModal").classList.add("open");
}

function closePutModal() {
  document.getElementById("putModal").classList.remove("open");
  setStatus("putStatus", "", "");
}

async function putItem() {
  let item;
  try {
    item = JSON.parse(document.getElementById("putItemJson").value);
  } catch (e) {
    setStatus("putStatus", "Invalid JSON format: " + e.message, "error");
    return;
  }

  try {
    const res = await api(`/tables/${encodeURIComponent(currentTable)}/items`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus("putStatus", data.error || "Could not save item", "error");
      return;
    }
    closePutModal();
    setStatus("tableStatus", "Item saved successfully", "ok");
    scanItems();
  } catch (err) {
    setStatus("putStatus", "Error: " + err.message, "error");
  }
}

loadUserInfo();
loadTables();
</script>
</body>
</html>
