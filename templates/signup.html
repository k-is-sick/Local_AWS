<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create account — LocalAWS</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --border:#2a313c; --text:#d6dde5; --muted:#8b94a3; --accent:#ff9900; --danger:#e5534b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; display:flex; align-items:center; gap:10px; }
  .logo { width:28px; height:28px; background:var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#161616; font-size:13px; }
  header a { color: var(--text); text-decoration: none; font-size: 14px; }
  .wrap { max-width: 380px; margin: 60px auto; padding: 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 28px; }
  .card h2 { font-size: 18px; margin: 0 0 20px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; margin-bottom: 16px; }
  button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: var(--accent); color: #161616; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .switch a { color: var(--accent); text-decoration: none; }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 12px; min-height: 16px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: -10px; margin-bottom: 16px; }
</style>
</head>
<body>
<header><div class="logo">L</div><a href="/">LocalAWS</a></header>
<div class="wrap">
  <div class="card">
    <h2>Create your LocalAWS account</h2>
    <div class="error" id="error"></div>
    <form id="signupForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
      <div class="hint">At least 6 characters</div>
      <button type="submit">Create account</button>
    </form>
    <div class="switch">Already have an account? <a href="/signin">Sign in</a></div>
  </div>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || "Signup failed"; return; }
    window.location.href = data.redirect;
  } catch (err) {
    errorEl.textContent = "Could not reach server";
  }
});
</script>
</body>
</html>
