<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LocalAWS</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #2a313c;
    --text: #d6dde5; --muted: #8b94a3; --accent: #ff9900;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #161616; font-size: 14px; }
  header h1 { font-size: 16px; margin: 0; }
  main { max-width: 720px; margin: 80px auto; text-align: center; padding: 0 24px; }
  main h2 { font-size: 32px; margin-bottom: 12px; }
  main p { color: var(--muted); font-size: 15px; margin-bottom: 36px; line-height: 1.5; }
  .actions { display: flex; gap: 16px; justify-content: center; }
  a.btn { text-decoration: none; padding: 12px 26px; border-radius: 6px; font-size: 14px; font-weight: 600; }
  a.primary { background: var(--accent); color: #161616; }
  a.secondary { border: 1px solid var(--border); color: var(--text); }
  a.btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<header>
  <div class="logo">L</div>
  <h1>LocalAWS</h1>
</header>
<main>
  <h2>A local cloud, on your own machine</h2>
  <p>LocalAWS is a self-hosted emulation of core AWS services — starting with S3 — for learning, testing, and building without touching real cloud infrastructure or costs.</p>
  <div class="actions">
    <a class="btn primary" href="/signin">Sign in</a>
    <a class="btn secondary" href="/signup">Create new account</a>
  </div>
</main>
</body>
</html>
