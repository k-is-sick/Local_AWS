<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — LocalAWS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-main: #0e1117;
    --bg-surface: #161b22;
    --bg-surface-hover: #1c2129;
    --bg-card: #1f242d;
    --border-default: #2e3745;
    --border-subtle: #242b35;
    --text-primary: #d6dde5;
    --text-muted: #8b94a3;
    --accent-orange: #ff9900;
    --accent-orange-hover: #ffaa22;
    --status-red: #f85149;
    --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-surface);
    padding: 14px 28px;
    border-bottom: 1px solid var(--border-default);
    display: flex;
    align-items: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .logo-box {
    width: 28px;
    height: 28px;
    background: var(--accent-orange);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #0e1117;
    font-family: var(--font-mono);
    font-size: 14px;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 600;
  }
  .wrap {
    max-width: 400px;
    width: 100%;
    margin: 60px auto;
    padding: 0 20px;
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .card-header i {
    color: var(--accent-orange);
    font-size: 18px;
  }
  .card h2 {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
  }
  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 4px;
    border: 1px solid var(--border-default);
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    margin-bottom: 20px;
    transition: border-color 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent-orange);
    box-shadow: 0 0 0 1px var(--accent-orange);
  }
  button {
    width: 100%;
    padding: 11px;
    border-radius: 4px;
    border: 1px solid var(--accent-orange);
    background: var(--accent-orange);
    color: #0e1117;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:hover {
    background: var(--accent-orange-hover);
    box-shadow: 0 0 12px rgba(255, 153, 0, 0.25);
  }
  .switch {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .switch a {
    color: var(--accent-orange);
    text-decoration: none;
    font-weight: 500;
  }
  .switch a:hover {
    text-decoration: underline;
  }
  .error {
    color: var(--status-red);
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.2);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .error:not(:empty) {
    display: block;
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/services">
    <img src="/static/images/Local_AWS_logo.png" alt="LocalAWS Logo" style="height:52px; width:auto; display:block; object-fit:contain;">
    <span class="brand-title">LocalAWS</span>
  </a>
</header>
<div class="wrap">
  <div style="display: flex; justify-content: center; margin-bottom: 20px;">
    <img src="/static/images/Local_AWS_logo.png" alt="LocalAWS Logo" style="height:64px; width:auto; display:block; object-fit:contain;">
  </div>
  <div class="card">
    <div class="card-header">
      <i class="fa-solid fa-lock"></i>
      <h2>Sign in to Console</h2>
    </div>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="developer@localaws.internal">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div class="switch">Don't have an account? <a href="/signup">Create one</a></div>
  </div>
  <div style="text-align: center; margin-top: 24px; font-size: 13px; color: #8b94a3;">
    made by <strong style="color: #c9d1d9;">k-is-sick</strong> and <strong style="color: #c9d1d9;">joshiyashsh</strong>
  </div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || "Login failed"; return; }
    window.location.href = data.redirect;
  } catch (err) {
    errorEl.textContent = "Could not reach server";
  }
});
</script>
</body>
</html>
